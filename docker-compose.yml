name: boio-agents-lab

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniagents
      POSTGRES_USER: miniagents
      POSTGRES_PASSWORD: miniagents
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniagents -d miniagents"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - miniagents-postgres:/var/lib/postgresql/data

volumes:
  miniagents-postgres:
